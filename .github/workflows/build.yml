name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The build only reads the repository and uploads an artifact, neither of which needs a
# write-scoped token. Without this the job inherits the repository default, which can be
# read-write - more than a pull-request build running third-party actions should hold.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    # Third-party actions are pinned to a full commit SHA, not a tag: a tag can be moved to
    # point at different code, a commit cannot. The trailing comment names the release.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing after checkout talks to GitHub, so the token need not stay in .git/config.
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Compiles all three modules and runs the full suite: unit tests, jqwik
      # property tests and the ArchUnit layering rules. The architecture rules failing
      # the build is the point - a layering violation should break CI, not sit in a
      # README as an unenforced claim.
      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/**'
          if-no-files-found: ignore
